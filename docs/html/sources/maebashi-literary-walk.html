<h1>朔太郎と歩く文学散歩</h1>
<p>公開情報の要約（2026-11-22）</p>
<p class="source">出典URL：https://www.maebashi-cvb.com/course/8246</p>
<p>前橋出身の詩人、萩原朔太郎にゆかりのある場所をめぐる徒歩コースです。広瀬川沿いには詩碑があり、前橋文学館では前橋にゆかりのある詩人の資料に触れられます。向かいの河畔緑地には敷島公園から移された朔太郎ゆかりの建物があります。</p>
