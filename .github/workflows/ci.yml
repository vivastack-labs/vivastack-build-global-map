---
name: CI

"on":
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install CLI
        run: npm ci
      - name: Validate site
        run: |
          grep -qxF '/ /world-atlas.html 200' docs/html/_redirects
          node --check docs/html/assets/atlas.js
          bash -n scripts/smoke-site.sh
          bash scripts/smoke-site.sh --check-files
          npm exec -- cf deploy ./docs/html --dry-run --no-provision
